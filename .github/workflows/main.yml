name: Build Hubget APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract ZIP files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          while IFS= read -r -d '' file; do
            echo "Extracting: $file"
            unzip -o "$file" -d extracted
          done < <(
            find . -maxdepth 3 -type f -name '*.zip' \
              ! -path './extracted/*' -print0
          )

          echo "Project files:"
          find . -maxdepth 5 -type f | sort | head -300

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find . \
            -type d \( -name .git -o -name .gradle \) -prune -o \
            -type f \( \
              -name settings.gradle \
              -o -name settings.gradle.kts \
            \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found. The ZIP may not contain a complete Android Gradle project."
            echo "Available project files:"
            find extracted -maxdepth 7 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          elif [ -f ./build.gradle ] || [ -f ./build.gradle.kts ]; then
            gradle --no-daemon assembleDebug
          else
            echo "::error::No Gradle build file found in the project root."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hubget-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
