name: Build Hubget APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ZIP and find project
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip

          mkdir -p extracted

          while IFS= read -r -d '' zipfile; do
            echo "Extracting: $zipfile"
            unzip -o "$zipfile" -d extracted
          done < <(
            find . -maxdepth 3 -type f -name '*.zip' \
              ! -path './extracted/*' -print0
          )

          echo "Searching for Gradle project..."

          SETTINGS=$(find extracted -maxdepth 10 -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::No Gradle settings file found in extracted ZIP."
            find extracted -maxdepth 6 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project: $PROJECT_DIR"

      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "::error::Missing $BUILD_FILE"
            exit 1
          fi

          echo "Updating Java and Kotlin targets..."

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle.kts"
          s = p.read_text()

          java_block = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """

          if "compileOptions {" in s:
              s = re.sub(
                  r"compileOptions\s*\{[^}]*\}",
                  java_block.strip(),
                  s,
                  count=1
              )
          else:
              pos = s.find("android {")
              if pos < 0:
                  raise SystemExit("ERROR: android { block not found")
              start = pos + len("android {")
              s = s[:start] + "\n" + java_block + s[start:]

          kotlin_block = """
              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          if "kotlinOptions {" in s:
              s = re.sub(
                  r"kotlinOptions\s*\{[^}]*\}",
                  kotlin_block.strip(),
                  s,
                  count=1
              )
          else:
              pos = s.find("android {")
              start = pos + len("android {")
              depth = 1
              i = start
              while i < len(s) and depth:
                  if s[i] == "{":
                      depth += 1
                  elif s[i] == "}":
                      depth -= 1
                  i += 1
              s = s[:i-1] + "\n" + kotlin_block + "\n" + s[i-1:]

          p.write_text(s)
          print("Updated:", p)
          print(s)
          PY

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hubget-APK
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
